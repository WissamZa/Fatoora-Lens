name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build split APKs and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release version
        run: |
          set -euo pipefail
          app_version="${RELEASE_TAG#v}"
          if [[ "${RELEASE_TAG}" != v* || ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}. Expected a tag such as v1.0.6." >&2
            exit 1
          fi
          echo "Building Fatoora Lens ${app_version}"

      - name: Run tests
        run: flutter test

      - name: Configure signing keystore from secrets
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APKs
        run: >-
          flutter build apk --release
          --split-per-abi
          --tree-shake-icons
          --obfuscate
          --split-debug-info=build/symbols

      - name: Publish GitHub Release with gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob

          # Rename generated APK files to append the tag version
          for file in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$file" ]; then
              base_name=$(basename "$file" .apk)
              mv "$file" "build/app/outputs/flutter-apk/${base_name}-${RELEASE_TAG}.apk"
            fi
          done

          apk_files=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK files were produced" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Fatoora Lens $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" \
              build/app/outputs/flutter-apk/*.apk \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              build/app/outputs/flutter-apk/*.apk \
              --title "Fatoora Lens $RELEASE_TAG" \
              --generate-notes
          fi

          expected_assets="${#apk_files[@]}"
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$actual_assets" -lt "$expected_assets" ]; then
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')
            upload_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.upload_url' | sed 's/{?name,label}//')
            for file in "${apk_files[@]}"; do
              file_name=$(basename "$file")
              gh api --method POST \
                -H "Content-Type: application/vnd.android.package-archive" \
                --input "$file" \
                "${upload_url}?name=${file_name}" >/dev/null
            done
          fi

          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$actual_assets" -ne "$expected_assets" ]; then
            echo "Expected ${expected_assets} APK release assets, found ${actual_assets}" >&2
            exit 1
          fi

      - name: Upload symbols as workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-symbols-${{ github.ref_name }}
          path: build/symbols
