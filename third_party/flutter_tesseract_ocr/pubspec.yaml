name: flutter_tesseract_ocr
description: >-
  Vendored copy of flutter_tesseract_ocr 0.4.31 (BSD-3) with an AGP 9
  compatible Android build. Tesseract 4 LSTM OCR engine with UTF-8 support
  for more than 100 languages.
version: 0.4.31

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.12.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.paratoner.flutter_tesseract_ocr
        pluginClass: FlutterTesseractOcrPlugin
      ios:
        pluginClass: FlutterTesseractOcrPlugin
