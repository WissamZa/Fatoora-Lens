name: fatoora_lens
description: Fatoora Lens - قارئ فواتير ZATCA مع تخزين محلي وتحليلات وتصدير.
publish_to: "none"
version: 1.1.0+1001000

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  csv: ^8.0.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  flutter_svg: ^2.3.0
  image_cropper: ^12.2.1
  package_info_plus: ^10.2.1
  # Vendored AGP 9 compatible copy of flutter_tesseract_ocr 0.4.31.
  flutter_tesseract_ocr:
    path: third_party/flutter_tesseract_ocr
  # Sync module (M1: transport layer + connection diagnostics).
  crypto: ^3.0.6
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.2
  # Sync module (M2: UUID identities + ZIP backups).
  uuid: ^4.5.1
  # Sync module (M4: X25519 handshake + AES-256-GCM session encryption).
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  archive: ^4.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/icons/sar_symbol.svg
    - assets/tessdata/
    - assets/tessdata_config.json
