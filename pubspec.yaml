name: fatoora_lens
description: Fatoora Lens - قارئ فواتير ZATCA مع تخزين محلي وتحليلات وتصدير.
publish_to: "none"
version: 1.0.8+1000008

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  csv: ^8.0.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  flutter_svg: ^2.3.0
  image_cropper: ^12.2.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/icons/sar_symbol.svg
